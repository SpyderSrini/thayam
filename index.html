<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>தாயம் · Thayam</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1 class="brand">தாயம்</h1>
      <button class="ghost-sm" type="button" id="rulesBtn">New / seats</button>
    </div>
    <div id="jsflag" class="jsflag">Open in Safari.</div>
    <div id="sheet" class="sheet">
      <button class="ghost-sm" type="button" id="newBtn">New game</button>
      <label>Players
        <select id="playerCount">
          <option value="2" selected>2 (Red vs Yellow)</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="vsAI" checked /> Others are AI</label>
      <div id="bases" class="bases"></div>
      <pre id="log" class="log"></pre>
    </div>
    <div class="board-wrap"><div id="board" class="board"></div></div>
    <div class="dock">
      <div class="dock-inner">
        <div id="win" class="win" style="display:none"></div>
        <div id="status"></div>
        <div class="dice-row">
          <div class="die" id="dieA">·</div>
          <div class="die" id="dieB">·</div>
          <div>
            <div class="roll-value" id="rollVal">—</div>
            <small>move</small>
          </div>
        </div>
        <div id="pool"></div>
        <div id="bench"></div>
        <button class="primary" type="button" id="rollBtn">Roll dice</button>
      </div>
    </div>
  </div>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      var f = document.getElementById("jsflag");
      if (f) f.className = "jsflag ok";
      var btn = document.getElementById("rulesBtn");
      var sheet = document.getElementById("sheet");
      if (btn && sheet) btn.onclick = function () { sheet.classList.toggle("open"); };
    })();
  </script>
</body>
</html>
